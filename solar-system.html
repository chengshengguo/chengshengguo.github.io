<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>太阳系模型 · Mickey 星空学习站</title>
    <meta name="description" content="可交互的太阳系运行模型：观察行星公转，点击星球查看资料。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .sim-wrap { display: flex; gap: 22px; flex-wrap: wrap; }
      .sim-canvas-box { flex: 1 1 480px; min-width: 300px; }
      #solar { width: 100%; height: auto; display: block; border-radius: var(--radius);
               background: radial-gradient(circle at 50% 50%, #0b1030, #04050e); border: 1px solid var(--border); }
      .sim-side { flex: 1 1 300px; min-width: 260px; }
      .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
      .controls input[type="range"] { flex: 1; accent-color: var(--accent-2); }
      .info h3 { margin: 0 0 6px; font-size: 1.4rem; }
      .info .stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .95rem; }
      .info .stat span:first-child { color: var(--muted); }
      .hint { font-size: .85rem; color: var(--muted); margin-top: 12px; }
      .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
      .legend span { font-size: .8rem; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
      .legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    </style>
  </head>
  <body>
    <canvas id="starfield"></canvas>
    <div class="page">
      <nav class="navbar">
        <a class="brand" href="index.html"><span class="logo">🚀</span><span>Mickey 星空学习站</span></a>
        <div class="nav-links">
          <a href="index.html">首页</a>
          <a href="astronomy.html">天文科普</a>
          <a href="solar-system.html" class="active">太阳系模型</a>
          <a href="english/">🅰️ 英语</a>
          <a href="math.html">➕ 口算</a>
          <a href="chinese/">📜 语文</a>
          <a href="gomoku.html">五子棋</a>
          <a href="sudoku/">数独</a>
          <a href="memory.html">记忆训练</a>
          <a href="learn_plan/index.html">📅 暑假计划</a>
        </div>
      </nav>

      <header class="subhero container">
        <span class="eyebrow">Universe Model</span>
        <h1>🪐 太阳系运行模型</h1>
        <p>行星正在围绕太阳公转（轨道与大小为示意，并非真实比例）。点击任意星球，查看它的资料。</p>
      </header>

      <section class="section container">
        <div class="sim-wrap">
          <div class="sim-canvas-box">
            <canvas id="solar" width="640" height="640"></canvas>
            <div class="legend" id="legend"></div>
          </div>
          <div class="sim-side">
            <div class="controls">
              <button class="btn" id="playBtn">⏸ 暂停</button>
              <span class="pill">速度</span>
              <input type="range" id="speed" min="0.2" max="3" step="0.1" value="1" />
            </div>
            <div class="panel info" id="info">
              <h3>☀️ 太阳</h3>
              <p class="muted">点击行星查看详情。太阳占太阳系总质量的 99.86%。</p>
            </div>
            <p class="hint">提示：拖动滑块可调快或调慢公转速度。土星带有美丽的光环。</p>
          </div>
        </div>
      </section>

      <footer class="footer"><div class="container"><p>✨ 想知道更多天文知识？<a href="astronomy.html">前往天文科普 →</a></p></div></footer>
    </div>

    <script src="js/starfield.js"></script>
    <script>
      const canvas = document.getElementById("solar");
      const ctx = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height, CX = W / 2, CY = H / 2;

      const PLANETS = [
        { name: "水星", color: "#b1a59a", orbit: 78, size: 4, speed: 1.6,
          fact: "离太阳最近，白天极热、夜晚极冷。", dia: "4,879 km", dist: "5,790 万 km", day: "59 天" },
        { name: "金星", color: "#e6c87a", orbit: 110, size: 7, speed: 1.18,
          fact: "表面被浓厚二氧化碳包裹，是太阳系最热的行星。", dia: "12,104 km", dist: "1.08 亿 km", day: "243 天" },
        { name: "地球", color: "#4f9cff", orbit: 146, size: 7.5, speed: 1.0,
          fact: "目前已知唯一有生命的星球，71% 被海洋覆盖。", dia: "12,742 km", dist: "1.5 亿 km", day: "24 小时" },
        { name: "火星", color: "#e2683c", orbit: 186, size: 5.5, speed: 0.81,
          fact: "红色来自表面铁锈，拥有太阳系最高的山——奥林帕斯山。", dia: "6,779 km", dist: "2.28 亿 km", day: "24.6 小时" },
        { name: "木星", color: "#d8a06a", orbit: 250, size: 18, speed: 0.44,
          fact: "最大的行星，著名的大红斑是一场持续百年的风暴。", dia: "139,820 km", dist: "7.78 亿 km", day: "9.9 小时" },
        { name: "土星", color: "#e3c48a", orbit: 312, size: 15, speed: 0.32, ring: true,
          fact: "拥有壮观的行星环，主要由冰和岩石碎块组成。", dia: "116,460 km", dist: "14.3 亿 km", day: "10.7 小时" },
        { name: "天王星", color: "#8fe3e3", orbit: 360, size: 11, speed: 0.23,
          fact: "几乎“躺着”自转，自转轴歪了约 98°。", dia: "50,724 km", dist: "28.7 亿 km", day: "17 小时" },
        { name: "海王星", color: "#4f6dff", orbit: 400, size: 11, speed: 0.18,
          fact: "最远的行星，狂风时速可超过 2000 km。", dia: "49,244 km", dist: "45 亿 km", day: "16 小时" },
      ];
      PLANETS.forEach((p) => (p.angle = Math.random() * Math.PI * 2));

      let speedMul = 1, playing = true, t = 0;
      const positions = {};

      function draw() {
        ctx.clearRect(0, 0, W, H);
        // 轨道
        PLANETS.forEach((p) => {
          ctx.beginPath();
          ctx.arc(CX, CY, p.orbit, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(255,255,255,0.08)";
          ctx.lineWidth = 1;
          ctx.stroke();
        });
        // 太阳
        const glow = ctx.createRadialGradient(CX, CY, 4, CX, CY, 40);
        glow.addColorStop(0, "rgba(255,221,120,0.9)");
        glow.addColorStop(1, "rgba(255,180,60,0)");
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(CX, CY, 40, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ffd34d";
        ctx.beginPath(); ctx.arc(CX, CY, 16, 0, Math.PI * 2); ctx.fill();
        // 行星
        PLANETS.forEach((p) => {
          const x = CX + Math.cos(p.angle) * p.orbit;
          const y = CY + Math.sin(p.angle) * p.orbit;
          positions[p.name] = { x, y };
          if (p.ring) {
            ctx.save(); ctx.translate(x, y); ctx.rotate(-0.4);
            ctx.strokeStyle = "rgba(227,196,138,0.8)"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.ellipse(0, 0, p.size * 2, p.size * 0.7, 0, 0, Math.PI * 2); ctx.stroke();
            ctx.restore();
          }
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(x, y, p.size, 0, Math.PI * 2); ctx.fill();
        });
      }

      function loop() {
        if (playing) {
          t += 0.016 * speedMul;
          PLANETS.forEach((p) => (p.angle += 0.01 * p.speed * speedMul));
        }
        draw();
        requestAnimationFrame(loop);
      }

      const info = document.getElementById("info");
      function showInfo(p) {
        info.innerHTML = `<h3 style="color:${p.color}">${p.name}</h3>
          <div class="stat"><span>直径</span><span>${p.dia}</span></div>
          <div class="stat"><span>距太阳</span><span>${p.dist}</span></div>
          <div class="stat"><span>自转一天</span><span>${p.day}</span></div>
          <p class="muted" style="margin-top:12px">${p.fact}</p>`;
      }

      canvas.addEventListener("click", (e) => {
        const r = canvas.getBoundingClientRect();
        const x = ((e.clientX - r.left) / r.width) * W;
        const y = ((e.clientY - r.top) / r.height) * H;
        let hit = null, best = 22;
        for (const p of PLANETS) {
          const d = Math.hypot(positions[p.name].x - x, positions[p.name].y - y);
          if (d < best) { best = d; hit = p; }
        }
        if (hit) showInfo(hit);
      });

      document.getElementById("playBtn").onclick = (e) => {
        playing = !playing;
        e.target.textContent = playing ? "⏸ 暂停" : "▶ 播放";
      };
      document.getElementById("speed").oninput = (e) => (speedMul = parseFloat(e.target.value));

      // 图例
      const legend = document.getElementById("legend");
      PLANETS.concat([{ name: "太阳", color: "#ffd34d" }]).forEach((p) => {
        const s = document.createElement("span");
        s.innerHTML = `<i style="background:${p.color}"></i>${p.name}`;
        legend.appendChild(s);
      });

      loop();
    </script>
  </body>
</html>
